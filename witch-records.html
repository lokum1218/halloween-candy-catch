<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>마녀 게임 관리자 기록실</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"><style>
.records-shell{max-width:1000px;margin:40px auto;padding:20px}.records-shell h1{font-size:36px}.records-shell a{color:#ffc679}.records-note{color:#d9b9d6;line-height:1.6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar button,#more{padding:12px 18px;background:#392045;border:1px solid #be859b;border-radius:8px;color:#fff0dc;font-size:16px}.toolbar button[aria-pressed=true]{background:#ffab51;color:#281427}.table-wrap{overflow:auto;border:1px solid #976078;border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-family:system-ui,sans-serif;font-size:15px}th,td{text-align:left;padding:15px;border-bottom:1px solid #57354f}th{background:#35203f;color:#ffd29a}td{background:#21152e}#record-status{min-height:24px;color:#ffce86}#more{margin-top:14px}[hidden]{display:none!important}button:focus-visible,a:focus-visible{outline:3px solid #ffd286;outline-offset:3px}@media(max-width:600px){.records-shell{margin:12px auto;padding:16px}.records-shell h1{font-size:30px}th,td{padding:11px}}
</style><script src="./witch-records.js?v=2" defer></script></head><body><main class="records-shell"><a href="./witch.html">← 게임으로 돌아가기</a><h1>🔒 마녀 게임 기록실</h1><form id="admin-login"><p class="records-note">운영자만 참가 기록을 확인할 수 있습니다.</p><label for="admin-password">관리자 비밀번호</label><div class="toolbar"><input id="admin-password" type="password" autocomplete="current-password" required maxlength="256" style="font-size:16px;padding:12px;border-radius:8px;max-width:100%;box-sizing:border-box"><button type="submit">기록 열기</button></div><p id="login-status" role="status"></p></form><section id="admin-content" hidden><button id="logout" type="button">기록실 잠그기</button><p class="records-note">닉네임별 최신 도전 기록을 표시합니다. 다시 도전하면 이 표의 기록이 갱신됩니다. 닉네임 소유 여부는 별도로 확인해 주세요.</p><div class="toolbar"><button id="refresh">새로고침</button><button id="csv">현재 기록 CSV 내려받기</button></div><p id="record-status" role="status">기록을 불러오는 중…</p><div class="table-wrap"><table><caption id="caption" style="text-align:left;padding:12px">닉네임별 최신 도전 · 버틴 시간순</caption><thead><tr><th>밴드 닉네임</th><th>던진 쿠키 수</th><th>버틴 시간</th></tr></thead><tbody id="rows"></tbody></table></div><button id="more" hidden>이전 기록 더 보기</button></section></main></body></html>
